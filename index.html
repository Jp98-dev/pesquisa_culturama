<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="shortcut icon" href="culturama-favico.png" type="image/x-icon">
    <link rel="stylesheet" href="css/style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fjalla+One&family=Work+Sans:ital@0;1&display=swap" rel="stylesheet">

    <title>Pesquisa Culturama</title>
  </head>
  <body>
    <main>
    <header>
      <img src="img/logo-culturama.png" alt="logo culturama">
      <h1>Pesquisa de Opinião</h1>
    </header>
    <section>
      <form action="" method="get">
        <fieldset>
          <legend>DADOS PESSOAIS</legend>
          <br>
          <label for="name">Nome:</label>
          <input id="name" type="text" name="userName" required />

          <br>

          <label for="age">Idade:</label>
          <input
            id="age"
            type="number"
            name="userAge"
            min="12"
            max="100"
            required/>

          <br>

          <label for="birthDate">Data de Nascimento:</label>
          <input id="birthDate" type="date" name="birthDate" />

          <br>

          <label for="userEmail">Email:</label>
          <input id="userEmail" type="email" name="userEmail" required />

          <br>

          <label for="userPhoneNumber">Telefone:</label>
          <input
            id="userPhoneNumber"
            type="tel"
            name="userPhoneNumber"
            pattern="[0-9]{11}"
            placeholder="DDD + numero"/>

          <br>

          <label for="userImage">Upload de foto</label>
          <input id="userImage" type="file" accept="image/*" name="userImage" />

          <br>
        </fieldset>

        <fieldset>
          <legend>PERFIL</legend>

          <p>Gênero:</p>
          <input id="fem" type="radio" name="userGender" value="Feminino" />
          <label for="fem">Feminino</label>

          <input id="mas" type="radio" name="userGender" value="Masculino" />
          <label for="mas">Masculino</label>

          <input id="not" type="radio" name="userGender" value="notInformed" />
          <label for="not">Prefiro não informar</label>

          <br>

          <label for="maritalStatus">Estado Civil:</label>
          <select id="maritalStatus" name="userMaritalStatus">
            <option value="notInformed">Selecione...</option>
            <option value="married">Casado(a)</option>
            <option value="single">Solteiro(a)</option>
            <option value="widower">Viúvo(a)</option>
            <option value="stableUnion">União Estável</option>
            <option value="divorced">Divorciado(a)</option>
          </select>

          <br>

          <label for="state">Estado:</label>
          <select id="state" name="userState">
            <option value="notInformed">Selecione...</option>
            <option value="acre">Acre</option>
            <option value="alagoas">Alagoas</option>
            <option value="amapa">Amapá</option>
            <option value="amazonas">Amazonas</option>
            <option value="bahia">Bahia</option>
            <option value="ceara">Ceará</option>
            <option value="distritoFederal">Distrito Federal</option>
            <option value="espiritoSanto">Espirito Santo</option>
            <option value="goias">Goiás</option>
            <option value="maranhao">Maranhão</option>
            <option value="matoGrossoDoSul">Mato Grosso do Sul</option>
            <option value="matoGrosso">Mato Grosso</option>
            <option value="minasGerais">Minas Gerais</option>
            <option value="para">Pará</option>
            <option value="paraiba">Paraíba</option>
            <option value="parana">Paraná</option>
            <option value="pernambuco">Pernambuco</option>
            <option value="piaui">Piauí</option>
            <option value="rioDeJaneiro">Rio de Janeiro</option>
            <option value="rioGrandeDoNorte">Rio Grande do Norte</option>
            <option value="rioGrandeDoSul">Rio Grande do Sul</option>
            <option value="rondonia">Rondônia</option>
            <option value="roraima">Roraima</option>
            <option value="santaCatarina">Santa Catarina</option>
            <option value="saoPaulo">São Paulo</option>
            <option value="sergipe">Sergipe</option>
            <option value="tocantins">Tocantins</option>
          </select>

          <br>

          <label for="city">Cidade</label>
          <input id="city" type="text" name="userCity" />

        </fieldset>
        <fieldset>
          <legend>HÁBITOS</legend>
          <p>Redes Sociais:</p>
          <input
            id="instagram"
            type="checkbox"
            name="social"
            value="instagram"/>
          <label for="instagram">Instagram</label>

          <br />

          <input id="facebook" type="checkbox" name="social" value="facebook" />
          <label for="facebook">Facebook</label>

          <br />

          <input id="linkedin" type="checkbox" name="social" value="linkedin" />
          <label for="linkedin">Linkedin</label>

          <br />

          <input id="x" type="checkbox" name="social" value="x" />
          <label for="x">X</label>

          <br />

          <label for="musicStyle">Estilo Musical:</label>
          <input
            list="styleTypes"
            type="text"
            name="userMusicStyle"
            id="musicStyle"
          />
          <datalist id="styleTypes">
            <option value="Rock"></option>
            <option value="Pop"></option>
            <option value="Samba"></option>
            <option value="Sertanejo"></option>
          </datalist>

          <br>
          <label for="favoriteColor">Cor Favorita:</label>
          <input type="color" name="userFavoriteColor" id="favoriteColor">
        </fieldset>

        <fieldset>
          <legend>OPNINIÃO</legend>
          <p>O que você achou da qualidade do nosso seviço?</p>

          <input type="radio" name="userServiceOpinion" id="otimo" value="otima">
          <label for="otimo">Ótima</label><br>

          <input type="radio" name="userServiceOpinion" id="boa" value="boa">
          <label for="boa">Boa</label><br>

          <input type="radio" name="userServiceOpinion" id="regular" value="regular">
          <label for="regular">Regular</label><br>

          <input type="radio" name="userServiceOpinion" id="ruim" value="ruim">
          <label for="ruim">Ruim</label><br><br>

          <label for="comment">Escreva sua opinião:</label>
          <textarea name="userComment" id="comment" placeholder="Digite aqui sua opinião..."></textarea>
        </fieldset>

        <fieldset>
          <legend>CONSENTIMENTO DE UTILIZAÇÃO DE DADOS (LGPD)</legend>
          <input type="checkbox" name="userConsentment" id="lgpd" required>
          <label for="lgpd">Estou de acordo com e autorizo o tratamento dos meus dados pessoais conforme a LGPD</label>

          <br>

          <input type="checkbox" name="userResults" id="emailLgpd">
          <label for="emailLgpd">Desejo receber resultados por email</label>
        </fieldset>
        <br>
        <button type="submit">Enviar</button>
        <button type="reset">Limpar</button>
      </form>
    </section>
    </main>

  </body>
</html>
